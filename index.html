<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131f">
  <title>Orbit — Space Exploration Quiz</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --page: #f4f6fb;
      --surface: #fff;
      --surface-raised: #f8f9fd;
      --ink: #171a2b;
      --muted: #73788d;
      --line: #e7e9f1;
      --accent: #6d5dfc;
      --accent-soft: #efedff;
      --success: #168a62;
      --success-soft: #e5f7ef;
      --error: #d54d65;
      --error-soft: #fff0f2;
      --shadow: 0 24px 70px rgb(34 39 74 / 10%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10131f;
        --surface: #191d2c;
        --surface-raised: #202537;
        --ink: #f1f2fa;
        --muted: #a0a5ba;
        --line: #30364a;
        --accent: #a49aff;
        --accent-soft: #302c50;
        --success: #56d6a4;
        --success-soft: #173a32;
        --error: #ff8293;
        --error-soft: #462831;
        --shadow: 0 24px 70px rgb(0 0 0 / 24%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 9%, rgb(109 93 252 / 10%), transparent 34rem),
        radial-gradient(ellipse at 88% 90%, rgb(71 188 208 / 10%), transparent 30rem),
        var(--page);
      font-size: 15px;
      line-height: 1.55;
      transition: background-color 180ms ease, color 180ms ease;
    }

    button { font: inherit; }

    .shell {
      width: min(100%, 560px);
      animation: arrive 550ms cubic-bezier(.2,.8,.2,1) both;
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 2px 18px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 750;
      letter-spacing: .04em;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: white;
      background: linear-gradient(140deg, #8274ff, #5947e6);
      box-shadow: 0 7px 18px rgb(109 93 252 / 27%);
      font-size: 17px;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .card-content { padding: clamp(24px, 6vw, 38px); }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
    }

    .score-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface-raised);
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }

    .score-pill strong { color: var(--ink); font-variant-numeric: tabular-nums; }

    .progress-track {
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--line);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8578ff, #56c5d5);
      transition: width 420ms cubic-bezier(.2,.8,.2,1);
    }

    .question-block { padding-top: 30px; }

    .question-number {
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }

    .question-title {
      margin: 8px 0 25px;
      font-size: clamp(22px, 5vw, 28px);
      line-height: 1.28;
      letter-spacing: -.035em;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    .option {
      width: 100%;
      min-height: 54px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 11px 15px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--ink);
      background: var(--surface);
      text-align: left;
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease, box-shadow 150ms ease;
    }

    .option:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--surface-raised);
      transform: translateY(-1px);
    }

    .option:focus-visible, .primary-button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent);
      outline-offset: 3px;
    }

    .option:disabled { cursor: default; }

    .option-key {
      width: 29px;
      height: 29px;
      flex: 0 0 29px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: var(--surface-raised);
      font-size: 12px;
      font-weight: 700;
      transition: inherit;
    }

    .option-text { flex: 1; }

    .option-icon {
      width: 22px;
      color: currentColor;
      font-size: 16px;
      text-align: center;
    }

    .option.is-correct {
      border-color: var(--success);
      color: var(--success);
      background: var(--success-soft);
      animation: pop 360ms cubic-bezier(.2,.8,.2,1);
    }

    .option.is-wrong {
      border-color: var(--error);
      color: var(--error);
      background: var(--error-soft);
      animation: shake 380ms ease-in-out;
    }

    .option.is-correct .option-key, .option.is-wrong .option-key {
      border-color: transparent;
      color: currentColor;
      background: color-mix(in srgb, currentColor 12%, transparent);
    }

    .feedback {
      min-height: 28px;
      margin: 15px 2px 0;
      color: var(--muted);
      font-size: 13px;
    }

    .feedback.success { color: var(--success); font-weight: 650; }
    .feedback.error { color: var(--error); font-weight: 650; }

    .actions {
      display: flex;
      justify-content: flex-end;
      min-height: 48px;
      margin-top: 12px;
    }

    .primary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 46px;
      padding: 0 20px;
      border: 0;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(135deg, #7a6cff, #5c4be8);
      box-shadow: 0 8px 20px rgb(109 93 252 / 25%);
      font-weight: 700;
      cursor: pointer;
      transition: transform 150ms ease, box-shadow 150ms ease;
    }

    .primary-button:hover { transform: translateY(-1px); box-shadow: 0 11px 24px rgb(109 93 252 / 32%); }
    .primary-button:active { transform: translateY(0); }

    .card-footer {
      padding: 14px 28px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      background: var(--surface-raised);
      font-size: 12px;
      text-align: center;
    }

    .result-screen { padding: clamp(34px, 8vw, 52px) clamp(24px, 7vw, 48px); text-align: center; }

    .result-emoji {
      width: 86px;
      height: 86px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--surface-raised);
      font-size: 43px;
      animation: pop 500ms cubic-bezier(.2,.8,.2,1) both;
    }

    .result-screen h1 {
      margin: 8px 0 8px;
      font-size: clamp(27px, 7vw, 36px);
      letter-spacing: -.04em;
    }

    h1#result-title {
      display: inline-block;
      padding: 11px 16px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      border-radius: 10px;
      color: var(--ink);
      background: var(--surface-raised);
      box-shadow: inset 0 1px 0 color-mix(in srgb, var(--accent) 12%, transparent);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(19px, 5vw, 25px);
      line-height: 1.35;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .result-copy { max-width: 350px; margin: 0 auto 23px; color: var(--muted); }

    .result-score {
      display: inline-flex;
      align-items: baseline;
      gap: 7px;
      margin-bottom: 27px;
      color: var(--accent);
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -.05em;
      font-variant-numeric: tabular-nums;
    }

    .result-score span { color: var(--muted); font-size: 15px; font-weight: 600; letter-spacing: 0; }

    .result-screen .primary-button { width: 100%; }
    [hidden] { display: none !important; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pop {
      0% { transform: scale(.96); }
      60% { transform: scale(1.035); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    @media (max-width: 480px) {
      body { padding: 28px 14px; }
      .masthead { margin-bottom: 14px; }
      .card { border-radius: 20px; }
      .card-footer { padding-inline: 18px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><span>ORBIT</span></div>
      <span class="eyebrow">Space exploration quiz</span>
    </header>

    <section class="card" aria-label="Space exploration quiz">
      <div id="quiz-screen">
        <div class="card-content">
          <div class="topline">
            <span class="eyebrow" id="question-count">Question 1</span>
            <span class="score-pill" aria-live="polite">★ Score <strong id="score">0</strong></span>
          </div>
          <div
            class="progress-track"
            role="progressbar"
            aria-label="Quiz progress"
            aria-valuemin="0"
            aria-valuemax="0"
            aria-valuenow="0"
            id="progress"
          ><div class="progress-fill" id="progress-fill"></div></div>

          <div class="question-block">
            <div class="question-number" id="question-topic">The solar system</div>
            <h1 class="question-title" id="question-title" tabindex="-1"></h1>
            <div class="options" id="options" role="group" aria-labelledby="question-title"></div>
            <p class="feedback" id="feedback" aria-live="polite"></p>
            <div class="actions">
              <button class="primary-button" id="next-button" type="button" hidden>
                Next question <span aria-hidden="true">→</span>
              </button>
            </div>
          </div>
        </div>
        <footer class="card-footer">A small step for you. A giant leap through the cosmos. <span aria-hidden="true">🚀</span></footer>
      </div>

      <div class="result-screen" id="result-screen" hidden>
        <div class="result-emoji" id="result-emoji" aria-hidden="true">🚀</div>
        <div class="eyebrow">Mission complete</div>
        <h1 id="result-title">Stellar work!</h1>
        <p class="result-copy" id="result-copy"></p>
        <div class="result-score"><strong id="final-score">0</strong><span id="final-total">out of 0</span></div>
        <button class="primary-button" id="restart-button" type="button">Play again <span aria-hidden="true">↻</span></button>
      </div>
    </section>
  </main>

  <script>
    const questions = [
      {
        topic: "The solar system",
        prompt: "Which planet is known as the Red Planet?",
        options: ["Venus", "Mars", "Jupiter", "Mercury"],
        answer: 1,
        fact: "Mars gets its rusty color from iron-rich dust on its surface."
      },
      {
        topic: "The Moon",
        prompt: "What causes the Moon to shine in our night sky?",
        options: ["It makes its own light", "It reflects sunlight", "Earth's oceans glow", "Stars light it from behind"],
        answer: 1,
        fact: "The Moon reflects sunlight toward Earth—it doesn't produce its own light."
      },
      {
        topic: "Deep space",
        prompt: "What is the name of the galaxy that contains our solar system?",
        options: ["Andromeda", "Whirlpool", "Milky Way", "Sombrero"],
        answer: 2,
        fact: "Our solar system lives in the Milky Way's Orion Arm."
      },
      {
        topic: "Space history",
        prompt: "Who was the first human to travel into space?",
        options: ["Neil Armstrong", "Yuri Gagarin", "Buzz Aldrin", "Valentina Tereshkova"],
        answer: 1,
        fact: "Cosmonaut Yuri Gagarin orbited Earth in Vostok 1 in 1961."
      },
      {
        topic: "Our star",
        prompt: "What is the Sun mostly made of?",
        options: ["Liquid rock", "Hydrogen and helium", "Oxygen and nitrogen", "Iron and nickel"],
        answer: 1,
        fact: "The Sun is a giant ball of plasma, made mostly of hydrogen and helium."
      },
      {
        topic: "Planet Earth",
        prompt: "About how long does Earth take to orbit the Sun once?",
        options: ["One day", "One month", "One year", "One decade"],
        answer: 2,
        fact: "One trip around the Sun takes Earth about 365.25 days."
      },
      {
        topic: "Space technology",
        prompt: "What does a telescope help astronomers do?",
        options: ["Hear distant planets", "See distant objects", "Travel to other stars", "Measure Earth's gravity"],
        answer: 1,
        fact: "Telescopes collect light, helping us observe objects very far away."
      },
      {
        topic: "The solar system",
        prompt: "Which planet has the most prominent ring system?",
        options: ["Saturn", "Neptune", "Earth", "Mars"],
        answer: 0,
        fact: "Saturn's rings are made of countless pieces of ice and rock."
      },
      {
        topic: "Space exploration",
        prompt: "What was the first artificial satellite to orbit Earth?",
        options: ["Explorer 1", "Sputnik 1", "Voyager 1", "Hubble"],
        answer: 1,
        fact: "Sputnik 1 launched in 1957, opening the space age."
      },
      {
        topic: "The Moon",
        prompt: "What was the name of the first crewed mission to land on the Moon?",
        options: ["Apollo 8", "Apollo 11", "Gemini 4", "Artemis I"],
        answer: 1,
        fact: "Apollo 11 landed on the Moon in July 1969."
      }
    ];

    const quizScreen = document.querySelector("#quiz-screen");
    const resultScreen = document.querySelector("#result-screen");
    const questionCount = document.querySelector("#question-count");
    const questionTopic = document.querySelector("#question-topic");
    const questionTitle = document.querySelector("#question-title");
    const optionsElement = document.querySelector("#options");
    const scoreElement = document.querySelector("#score");
    const progress = document.querySelector("#progress");
    const progressFill = document.querySelector("#progress-fill");
    const feedback = document.querySelector("#feedback");
    const nextButton = document.querySelector("#next-button");
    let questionIndex = 0;
    let score = 0;
    let answered = false;
    let activeQuestions = [];

    function shuffledQuestions() {
      const shuffled = [...questions];

      for (let index = shuffled.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [shuffled[index], shuffled[randomIndex]] = [shuffled[randomIndex], shuffled[index]];
      }

      return shuffled;
    }

    function startAttempt(previousQuestions = null) {
      activeQuestions = shuffledQuestions();

      if (previousQuestions && activeQuestions.length > 1 &&
          activeQuestions.every((question, index) => question === previousQuestions[index])) {
        activeQuestions.push(activeQuestions.shift());
      }

      questionIndex = 0;
      score = 0;
      answered = false;
      scoreElement.textContent = "0";
      progress.setAttribute("aria-valuemax", activeQuestions.length);
      progress.setAttribute("aria-valuenow", "0");
      progressFill.style.width = "0";
      document.querySelector("#final-total").textContent = `out of ${activeQuestions.length}`;
    }

    function renderQuestion() {
      const question = activeQuestions[questionIndex];
      questionCount.textContent = `Question ${questionIndex + 1} of ${activeQuestions.length}`;
      questionTopic.textContent = question.topic;
      questionTitle.textContent = question.prompt;
      optionsElement.replaceChildren();
      feedback.textContent = "";
      feedback.className = "feedback";
      nextButton.hidden = true;
      answered = false;

      question.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "option";
        button.setAttribute("aria-label", `${String.fromCharCode(65 + index)}: ${option}`);
        button.innerHTML = `<span class="option-key" aria-hidden="true">${String.fromCharCode(65 + index)}</span><span class="option-text"></span><span class="option-icon" aria-hidden="true"></span>`;
        button.querySelector(".option-text").textContent = option;
        button.addEventListener("click", () => chooseAnswer(index));
        optionsElement.append(button);
      });
    }

    function chooseAnswer(selectedIndex) {
      if (answered) return;
      answered = true;
      const question = activeQuestions[questionIndex];
      const buttons = [...optionsElement.querySelectorAll(".option")];
      buttons.forEach((button) => { button.disabled = true; });

      const correctButton = buttons[question.answer];
      correctButton.classList.add("is-correct");
      correctButton.querySelector(".option-icon").textContent = "✓";

      if (selectedIndex === question.answer) {
        score += 1;
        scoreElement.textContent = score;
        feedback.textContent = `Correct! ${question.fact}`;
        feedback.classList.add("success");
      } else {
        const selectedButton = buttons[selectedIndex];
        selectedButton.classList.add("is-wrong");
        selectedButton.querySelector(".option-icon").textContent = "×";
        feedback.textContent = `Not quite. ${question.fact}`;
        feedback.classList.add("error");
      }

      const completed = questionIndex + 1;
      progress.setAttribute("aria-valuenow", completed);
      progressFill.style.width = `${(completed / activeQuestions.length) * 100}%`;
      nextButton.textContent = questionIndex === activeQuestions.length - 1 ? "See your results" : "Next question";
      nextButton.append(document.createElement("span"));
      nextButton.lastElementChild.setAttribute("aria-hidden", "true");
      nextButton.lastElementChild.textContent = questionIndex === activeQuestions.length - 1 ? "✦" : "→";
      nextButton.hidden = false;
      nextButton.focus();
    }

    function showResults() {
      quizScreen.hidden = true;
      resultScreen.hidden = false;
      document.querySelector("#final-score").textContent = score;

      const result = score === activeQuestions.length
        ? ["🌟", "Out of this world!", "Perfect score! You know your way around the cosmos."]
        : score >= Math.ceil(activeQuestions.length * 0.7)
          ? ["🚀", "Stellar work!", "Your space knowledge is soaring. Keep exploring the universe."]
          : score >= Math.ceil(activeQuestions.length * 0.4)
            ? ["🪐", "Nice orbit!", "You've got a great start—there's always more to discover."]
            : ["🌙", "Curious explorer!", "Every great mission starts with a question. Ready for another orbit?"];

      document.querySelector("#result-emoji").textContent = result[0];
      document.querySelector("#result-title").textContent = result[1];
      document.querySelector("#result-copy").textContent = result[2];
      document.querySelector("#restart-button").focus();
    }

    nextButton.addEventListener("click", () => {
      if (questionIndex === activeQuestions.length - 1) {
        showResults();
      } else {
        questionIndex += 1;
        renderQuestion();
        questionTitle.focus?.();
      }
    });

    document.querySelector("#restart-button").addEventListener("click", () => {
      const completedQuestions = activeQuestions;
      startAttempt(completedQuestions);
      resultScreen.hidden = true;
      quizScreen.hidden = false;
      renderQuestion();
      optionsElement.querySelector("button")?.focus();
    });

    startAttempt();
    renderQuestion();
  </script>
</body>
</html>
